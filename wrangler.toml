name = "midgley-intraday-monitor"
main = "workers/intraday_monitor_worker.ts"
compatibility_date = "2024-09-01"

[vars]
AXIOM_DATASET = "midgley-workers"
EDGAR_8K_TICKERS = "PBF,DINO,MPC,VLO,PSX"
# SEC_USER_AGENT is sensitive — set as a Worker secret (never commit to wrangler.toml):
# wrangler secret put SEC_USER_AGENT
# Value format: "Midgley your@email.com" (per EDGAR robots.txt policy)

[triggers]
crons = ["*/15 * * * *"]

[[queues.producers]]
queue = "intraday-event-queue"
binding = "INTRADAY_QUEUE"

[[queues.consumers]]
queue = "intraday-event-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "intraday-event-dlq"


[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true
