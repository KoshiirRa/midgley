name: Daily Gas Price LLM Forecasting & Public Dashboard

on:
  schedule:
    # Run daily at 22:17 UTC (05:17 PM CDT / 04:17 PM CST) - post-NYMEX settlement & post-EIA publication window.
    # Note: GitHub Actions cron triggers evaluate strictly against UTC. During US Daylight Saving Time (DST)
    # transitions (March to November), local US Central Time is UTC-5 (CDT, 05:17 PM); during standard time
    # (November to March), local US Central Time is UTC-6 (CST, 04:17 PM).
    # Paired with intraday_event_monitor.yml (recurring 2h cycle) to ingest any overnight geopolitical/weather shocks.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "production-data-deployment"
  cancel-in-progress: false

jobs:
  forecast-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Static Analysis Gate (Fatal & Syntax Errors)
        run: |
          ruff check src/ scripts/ tests/

      - name: Cache Lookup Datastore & Quota Ledger
        uses: actions/cache@v4
        with:
          path: |
            data/lookup_cache.sqlite
            data/agent_memory.sqlite
            data/finlight_quota.json
          key: lookup-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lookup-cache-${{ runner.os }}-

      - name: Run National & Tulsa Regional LLM Gas Price Pipeline
        env:
          MIDGLEY_BRANCH: ${{ github.ref_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BANK_ID: "Midgley"
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          HEADLINE_ARENA_CLIENT_ID: ${{ secrets.HEADLINE_ARENA_CLIENT_ID }}
          HEADLINE_ARENA_CLIENT_SECRET: ${{ secrets.HEADLINE_ARENA_CLIENT_SECRET }}
          MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION: ${{ vars.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION || secrets.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION }}
          MIDGLEY_ENV: "prod"
        run: |
          set -eo pipefail
          python -u run_all.py --use-llm-api 2>&1 | tee run_all_output.log

      - name: Update README Live Forecast Summary Table
        run: |
          python scripts/readme_updater.py

      - name: Upload Pipeline Execution Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-log
          path: run_all_output.log
          if-no-files-found: ignore

      - name: Commit and Push Updated README, Dashboard & Data
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout "origin/$BRANCH" -- data/headline_arena_*.json 2>/dev/null || true
          git add README.md MODEL_LEARNING.md docs data
          if ! git diff --quiet; then
            git diff --name-only
            echo "::error::Unexpected modified tracked files detected"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: Daily automated gas price prediction & public dashboard update [skip ci]"
            for i in 1 2 3; do
              git checkout "origin/$BRANCH" -- data/headline_arena_*.json 2>/dev/null || true
              if git pull --rebase origin "$BRANCH"; then
                git push origin "HEAD:$BRANCH" && exit 0
              else
                git rebase --abort || true
              fi
              sleep $((i * 15))
            done
            echo "::error::Could not rebase and push after 3 attempts"; exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
