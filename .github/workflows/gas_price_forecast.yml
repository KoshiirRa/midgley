name: Daily Gas Price LLM Forecasting

on:
  schedule:
    # Run every day at 07:00 UTC (02:00 AM Central)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run National & Tulsa Regional LLM Gas Price Forecasting Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python run_all.py --use-llm-api

      - name: Commit Updated Prediction Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prediction_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chmod: Daily automated gas price prediction log update" && git push)
