name: Daily Gas Price LLM Forecasting & Public Dashboard

on:
  schedule:
    # Run every day at 07:17 UTC (02:17 AM Central) - off-peak minute to prevent runner queue delays
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  forecast-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Lookup Datastore & Quota Ledger
        uses: actions/cache@v4
        with:
          path: |
            data/lookup_cache.sqlite
            data/finlight_quota.json
          key: lookup-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lookup-cache-${{ runner.os }}-

      - name: Run National & Tulsa Regional LLM Gas Price Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set -eo pipefail
          python -u run_all.py --use-llm-api 2>&1 | tee run_all_output.log

      - name: Upload Pipeline Execution Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-log
          path: run_all_output.log
          if-no-files-found: ignore

      - name: Commit Updated README, Dashboard & Prediction Logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Daily automated gas price prediction & public dashboard update [skip ci]"
          file_pattern: "README.md docs/ data/"
          push_options: '--force'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
