name: Daily Gas Price LLM Forecasting & Public Dashboard

on:
  schedule:
    # Run every day at 07:00 UTC (02:00 AM Central)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  forecast-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run National & Tulsa Regional LLM Gas Price Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python run_all.py --use-llm-api

      - name: Commit Updated README, Dashboard & Prediction Logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chmod: Daily automated gas price prediction & public dashboard update [skip ci]"
          file_pattern: "README.md docs/index.html docs/math.html data/prediction_history.csv"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
