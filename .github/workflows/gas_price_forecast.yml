name: Daily Gas Price LLM Forecasting & Public Dashboard

on:
  schedule:
    # Run every day at 07:17 UTC (02:17 AM Central) - off-peak minute to prevent runner queue delays
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  forecast-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Lookup Datastore & Quota Ledger
        uses: actions/cache@v4
        with:
          path: |
            data/lookup_cache.sqlite
            data/finlight_quota.json
          key: lookup-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lookup-cache-${{ runner.os }}-

      - name: Run National & Tulsa Regional LLM Gas Price Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
        run: |
          python run_all.py --use-llm-api

      - name: Commit Updated README, Dashboard & Prediction Logs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chmod: Daily automated gas price prediction & public dashboard update"
          file_pattern: "README.md docs/ data/prediction_history.csv"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
