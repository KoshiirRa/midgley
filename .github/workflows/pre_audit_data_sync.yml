name: Friday Pre-Audit Production Data Sync & Discord Notification

on:
  schedule:
    # Run every Friday at 21:00 UTC (04:00 PM US Central Time) - before Saturday weekly model review
    - cron: '0 21 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "production-data-deployment"
  cancel-in-progress: false

jobs:
  pre-audit-sync:
    name: Reconcile Main Production Data into Dev
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository (Dev Branch)
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Production Data Reconciliation & Dispatch Discord Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTRADAY_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/reconcile_production_sync.py
