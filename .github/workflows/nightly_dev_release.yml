name: Automated Nightly Dev Release

on:
  schedule:
    # Run every day at 08:14 UTC (03:14 AM Central Time) - off-peak minute
    - cron: '14 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  nightly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Milestone Completion & Auto-Promote Model Version
        id: milestone_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python src/milestone_checker.py
          
          # If files were modified by auto-promotion, commit and push to dev
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(model): Auto-promote active model version upon milestone completion"
            git push origin dev
          fi

      - name: Set Release Tag and Date
        id: release_vars
        run: |
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          TAG_NAME="dev-${RELEASE_DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ steps.release_vars.outputs.tag_name }}"
          RELEASE_DATE="${{ steps.release_vars.outputs.release_date }}"

          # Find previous dev- tag if it exists
          PREV_TAG=$(git tag -l "dev-*" | grep -v "^${TAG_NAME}$" | sort -r | head -n 1 || true)

          echo "## 🌙 Midgley Nightly Dev Release (\`${RELEASE_DATE}\`)" > release_body.md
          echo "" >> release_body.md
          echo "**Branch:** \`dev\` | **Target:** \`origin/dev\`" >> release_body.md
          echo "" >> release_body.md

          # Include Model Promotion Announcement if triggered
          if [ "${{ steps.milestone_check.outputs.model_promoted }}" == "true" ]; then
            echo "> [!IMPORTANT]" >> release_body.md
            echo "> 🎉 **Model Version Auto-Promoted to \`${{ steps.milestone_check.outputs.promoted_title }}\`!**" >> release_body.md
            echo "> All component issues for milestone \`${{ steps.milestone_check.outputs.promoted_title }}\` have been fully completed and released." >> release_body.md
            echo "" >> release_body.md
          fi

          echo "### 📝 Changes Committed in this Release Window" >> release_body.md
          echo "" >> release_body.md

          if [ -n "$PREV_TAG" ]; then
            echo "*Changes since tag \`${PREV_TAG}\`:*" >> release_body.md
            echo "" >> release_body.md
            git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - *@%an*" "${PREV_TAG}..HEAD" >> release_body.md
          else
            echo "*Changes in recent history:*" >> release_body.md
            echo "" >> release_body.md
            git log -n 15 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - *@%an*" >> release_body.md
          fi

          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "*Automated nightly development build generated by GitHub Actions on $(date -u +'%Y-%m-%d %H:%M UTC').*" >> release_body.md

      - name: Create or Update GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release_vars.outputs.tag_name }}"
          RELEASE_DATE="${{ steps.release_vars.outputs.release_date }}"

          # Delete local/remote tag if it already exists for today to allow re-runs
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true

          gh release create "$TAG_NAME" \
            --target dev \
            --title "Nightly Dev Release: ${RELEASE_DATE}" \
            --notes-file release_body.md \
            --prerelease
