name: Automated Nightly Dev Release

on:
  schedule:
    # Run every day at 08:00 UTC (03:00 AM Central Time)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Tag and Date
        id: release_vars
        run: |
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          TAG_NAME="dev-${RELEASE_DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ steps.release_vars.outputs.tag_name }}"
          RELEASE_DATE="${{ steps.release_vars.outputs.release_date }}"

          # Find previous dev- tag if it exists
          PREV_TAG=$(git tag -l "dev-*" | grep -v "^${TAG_NAME}$" | sort -r | head -n 1 || true)

          echo "## 🌙 Midgley Nightly Dev Release (\`${RELEASE_DATE}\`)" > release_body.md
          echo "" >> release_body.md
          echo "**Branch:** \`dev\` | **Target:** \`origin/dev\`" >> release_body.md
          echo "" >> release_body.md
          echo "### 📝 Changes Committed in this Release Window" >> release_body.md
          echo "" >> release_body.md

          if [ -n "$PREV_TAG" ]; then
            echo "*Changes since tag \`${PREV_TAG}\`:*" >> release_body.md
            echo "" >> release_body.md
            git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - *@%an*" "${PREV_TAG}..HEAD" >> release_body.md
          else
            echo "*Changes in recent history:*" >> release_body.md
            echo "" >> release_body.md
            git log -n 15 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - *@%an*" >> release_body.md
          fi

          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "*Automated nightly development build generated by GitHub Actions on $(date -u +'%Y-%m-%d %H:%M UTC').*" >> release_body.md

      - name: Create or Update GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release_vars.outputs.tag_name }}"
          RELEASE_DATE="${{ steps.release_vars.outputs.release_date }}"

          # Delete local/remote tag if it already exists for today to allow re-runs
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true

          gh release create "$TAG_NAME" \
            --target dev \
            --title "Nightly Dev Release: ${RELEASE_DATE}" \
            --notes-file release_body.md \
            --prerelease
