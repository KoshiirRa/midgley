name: Intraday Anomaly Edge Dispatch & Dashboard Deployment

on:
  schedule:
    # 2-hour recurring fallback intraday review
    - cron: '0 */2 * * *'
  repository_dispatch:
    types: [intraday_anomaly]
  workflow_dispatch:
    inputs:
      headline:
        description: 'Headline text to evaluate'
        required: false
        default: ''
      source:
        description: 'Source identifier'
        required: false
        default: 'Manual_Dispatch'
      url:
        description: 'Article URL'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "production-data-deployment"
  cancel-in-progress: false

jobs:
  intraday-monitor-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process Intraday Event
        env:
          HEADLINE: ${{ github.event.client_payload.headline || inputs.headline }}
          SOURCE: ${{ github.event.client_payload.source || inputs.source || 'Cloudflare_Worker' }}
          URL: ${{ github.event.client_payload.url || inputs.url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INTRADAY_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          HEADLINE_ARENA_CLIENT_ID: ${{ secrets.HEADLINE_ARENA_CLIENT_ID }}
          HEADLINE_ARENA_CLIENT_SECRET: ${{ secrets.HEADLINE_ARENA_CLIENT_SECRET }}
          MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION: ${{ vars.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION || secrets.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION }}
          MIDGLEY_ENV: "prod"
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BANK_ID: "Midgley"
        run: |
          if [ -n "$HEADLINE" ]; then
            python -m src.intraday_event_monitor --headline "$HEADLINE" --source "$SOURCE" --url "$URL"
          else
            python -m src.intraday_event_monitor
          fi

      - name: Commit and Push Updated README, Dashboard & Prediction Logs
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs data
          if ! git diff --cached --quiet; then
            git commit -m "chore: Intraday event anomaly dispatch & public dashboard update [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH"; then
                git push origin "HEAD:$BRANCH" && exit 0
              else
                git rebase --abort
              fi
              sleep $((i * 15))
            done
            echo "::error::Could not rebase and push after 3 attempts"; exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
