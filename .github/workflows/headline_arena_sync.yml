name: Headline Arena Async Challenge Sync

on:
  schedule:
    # Run every 30 minutes (at XX:15 and XX:45) to avoid collision with top-of-hour workflows
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "headline-arena-sync-workflow"
  cancel-in-progress: false

jobs:
  sync-headline-arena:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch Cached Forecasts to Headline Arena
        env:
          HEADLINE_ARENA_BASE_URL: ${{ secrets.HEADLINE_ARENA_BASE_URL || 'https://headlinearena.com/api/v1' }}
          HEADLINE_ARENA_CLIENT_ID: ${{ secrets.HEADLINE_ARENA_CLIENT_ID }}
          HEADLINE_ARENA_CLIENT_SECRET: ${{ secrets.HEADLINE_ARENA_CLIENT_SECRET }}
          MIDGLEY_ENV: prod
        run: |
          python scripts/sync_headline_arena.py

      - name: Commit and Push Updated Pending Cache and Ledger
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/headline_arena_pending_forecasts.json data/headline_arena_submitted_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(headline-arena): Update pending forecasts cache and submission ledger [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH"; then
                git push origin "HEAD:$BRANCH" && exit 0
              else
                git rebase --abort || true
              fi
              sleep $((i * 15))
            done
            echo "::error::Could not rebase and push after 3 attempts"; exit 1
          else
            echo "No changes in Headline Arena pending forecasts or submitted ledger."
          fi
