name: Auto-Sync Main Branch into Self-Hosted Branch

on:
  push:
    branches:
      - main

jobs:
  sync-self-hosted:
    name: Merge Main into Self-Hosted Branch
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (Self-Hosted Branch)
        uses: actions/checkout@v4
        with:
          ref: self-hosted
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Main Branch into Self-Hosted
        run: |
          git fetch origin main:main
          git merge main -m "chore(sync): auto-merge main updates into self-hosted branch"

      - name: Push Synchronized Self-Hosted Branch
        run: |
          git push origin self-hosted
