name: Auto-Sync Main Branch into Self-Hosted Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-self-hosted
  cancel-in-progress: false

jobs:
  sync-self-hosted:
    name: Merge Main into Self-Hosted Branch
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (Self-Hosted Branch)
        uses: actions/checkout@v7
        with:
          ref: self-hosted
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Main Branch into Self-Hosted
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          git fetch origin main self-hosted
          git reset --hard origin/self-hosted

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "self-hosted is already up to date with origin/main."
            exit 0
          fi

          if ! git merge origin/main -X theirs --no-edit -m "chore(sync): auto-merge main updates into self-hosted branch"; then
            echo "Resolving remaining modify/delete conflicts in favor of origin/main..."
            for f in $(git diff --name-only --diff-filter=U); do
              if git cat-file -e "origin/main:$f" 2>/dev/null; then
                git checkout origin/main -- "$f"
                git add "$f"
              else
                git rm -f "$f"
              fi
            done
            git commit --no-edit -m "chore(sync): auto-merge main updates into self-hosted branch"
          fi

      - name: Push Synchronized Self-Hosted Branch
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:self-hosted; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; re-fetching origin/self-hosted and retrying..."
            git fetch origin self-hosted
            git merge origin/self-hosted -X ours --no-edit -m "chore(sync): reconcile concurrent self-hosted update"
          done
          echo "Failed to push self-hosted after 3 attempts."
          exit 1

