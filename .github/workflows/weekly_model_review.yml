name: Weekly Model Performance Review & Dashboard Deployment

on:
  schedule:
    # Run every Saturday at 13:12 UTC (08:12 AM US Central Time) - off-peak minute
    - cron: '12 13 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "production-data-deployment"
  cancel-in-progress: false

jobs:
  weekly-review-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Static Analysis Gate (Fatal & Syntax Errors)
        run: |
          ruff check src/ scripts/ tests/

      - name: Cache Lookup Datastore & Quota Ledger
        uses: actions/cache@v4
        with:
          path: |
            data/lookup_cache.sqlite
            data/agent_memory.sqlite
            data/finlight_quota.json
          key: lookup-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lookup-cache-${{ runner.os }}-

      - name: Execute Full National & Tulsa LLM Pipeline & Performance Backtest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BANK_ID: "Midgley"
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION: ${{ vars.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION || secrets.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION }}
        run: |
          python run_all.py --use-llm-api

      - name: Open Weekly GitHub Issue Report & Recommendations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_DEGRADATION_WEBHOOK_URL: ${{ secrets.MODEL_DEGRADATION_WEBHOOK_URL }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python -m src.weekly_issue_reporter

      - name: Regenerate Public Dashboard with Updated Reflections
        env:
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BANK_ID: "Midgley"
        run: |
          python run_all.py --dashboard-only

      - name: Commit and Push Updated Performance Metrics & Prediction History
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md MODEL_LEARNING.md docs data
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            echo "::warning::Unstaged tracked modifications detected prior to commit"
            git add -u
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: Weekly Saturday model performance review & rolling accuracy update [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH"; then
                git push origin "HEAD:$BRANCH" && exit 0
              else
                git rebase --abort || true
              fi
              sleep $((i * 15))
            done
            echo "::error::Could not rebase and push after 3 attempts"; exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
