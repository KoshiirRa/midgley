name: Weekly Model Performance Review & Dashboard Deployment

on:
  schedule:
    # Run every Saturday at 13:12 UTC (08:12 AM US Central Time) - off-peak minute
    - cron: '12 13 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "production-data-deployment"
  cancel-in-progress: false

jobs:
  weekly-review-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Static Analysis Gate (Fatal & Syntax Errors)
        run: |
          ruff check src/ scripts/ tests/

      - name: Cache Lookup Datastore & Quota Ledger
        uses: actions/cache@v6
        with:
          path: |
            data/lookup_cache.sqlite
            data/agent_memory.sqlite
            data/finlight_quota.json
          key: lookup-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lookup-cache-${{ runner.os }}-

      - name: Execute Full National & Tulsa LLM Pipeline & Performance Backtest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_CACHE_URL: ${{ secrets.CLOUDFLARE_CACHE_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BANK_ID: "Midgley"
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION: ${{ vars.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION || secrets.MIDGLEY_ENABLE_MULTI_AGENT_SIMULATION }}
        run: |
          python run_all.py --use-llm-api

      - name: Open Weekly GitHub Issue Report & Recommendations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_DEGRADATION_WEBHOOK_URL: ${{ secrets.MODEL_DEGRADATION_WEBHOOK_URL }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          HINDSIGHT_API_URL: ${{ secrets.HINDSIGHT_API_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python -m src.weekly_issue_reporter

      - name: Regenerate Public Dashboard with Updated Reflections
        run: |
          python run_all.py --dashboard-only

      - name: Commit Updated Performance Metrics & Prediction History
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chrono: Weekly Saturday model performance review & rolling accuracy update"
          file_pattern: "README.md docs/ data/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
