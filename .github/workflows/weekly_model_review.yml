name: Weekly Model Performance Review & Dashboard Deployment

on:
  schedule:
    # Run every Saturday at 13:00 UTC (08:00 AM US Central Time)
    - cron: '0 13 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  weekly-review-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full National & Tulsa LLM Pipeline & Performance Backtest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FINLIGHT_API_KEY: ${{ secrets.FINLIGHT_API_KEY }}
        run: |
          python run_all.py --use-llm-api

      - name: Open Weekly GitHub Issue Report & Recommendations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.weekly_issue_reporter

      - name: Commit Updated Performance Metrics & Prediction History
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chrono: Weekly Saturday model performance review & rolling accuracy update"
          file_pattern: "README.md docs/ data/prediction_history.csv"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
