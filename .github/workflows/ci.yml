name: CI Testing & Static Analysis Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov ruff

      - name: Run Ruff Lint & Syntax Gate
        run: |
          ruff check src/ scripts/ tests/

      - name: Python Import Smoke Check
        run: |
          python -c "import run_all, src.intraday_event_monitor, src.api_server, src.event_analyzer, src.models, src.model_evaluation, src.headline_arena_connector"

      - name: Run Pytest Regression Suite with Coverage
        env:
          TESTING: "1"
        run: |
          pytest -v --cov=src --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml tests/

      - name: Publish Coverage Summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          python - << 'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100.0
          lines_covered = int(root.attrib.get("lines-covered", 0))
          lines_valid = int(root.attrib.get("lines-valid", 0))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(f"### Python ${{ matrix.python-version }} Test Coverage (`src/`)\n\n")
                  fh.write(f"- **Line Coverage:** `{line_rate:.2f}%` ({lines_covered:,} / {lines_valid:,} statements)\n")
          print(f"Coverage (src/): {line_rate:.2f}% ({lines_covered}/{lines_valid})")
          PY
