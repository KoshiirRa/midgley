name: Automated False Positive Issue Reviewer

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  review_false_positive:
    if: contains(github.event.issue.labels.*.name, 'false-positive')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Diagnostic Reviewer & Post Feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/review_false_positive.py --issue-number ${{ github.event.issue.number }}
