name: Automated False Positive Issue Reviewer

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub Issue number to review"
        required: true
        type: string

concurrency:
  group: false-positive-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  review_false_positive:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'false-positive')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'false-positive')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Diagnostic Reviewer & Post Feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/review_false_positive.py --issue-number ${{ github.event.issue.number || inputs.issue_number }}
