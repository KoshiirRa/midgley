name: Deploy Cloudflare Edge Worker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'workers/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      NODE_OPTIONS: "--no-warnings"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Worker Dependencies
        run: npm install

      - name: Run TypeScript Typecheck & Worker Tests
        run: |
          npm run typecheck
          npm test

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          preCommands: |
            npx wrangler queues create intraday-event-dlq || true
            npx wrangler queues create intraday-event-queue || true

