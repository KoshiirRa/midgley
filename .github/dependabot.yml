# Dependabot Configuration with Grouped Pull Requests
version: 2
updates:
  # Python Dependencies (Grouped into 1 Weekly PR)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      python-packages:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # GitHub Actions Workflow Dependencies (Grouped into 1 Weekly PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      actions-workflows:
        patterns:
          - "*"
    open-pull-requests-limit: 2
