[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midgley"
version = "0.6.8"
description = "LLM-Augmented Unleaded Gasoline Price Prediction Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "KoshiirRa"}
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.0",
    "google-genai>=0.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0",
    "feedparser>=6.0.14",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0",
    "py-gasbuddy>=0.7.1",
    "networkx>=3.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]
mcp = [
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0"
]
feature-store = [
    "feast>=0.40.0",
    "pyarrow>=15.0.0"
]
research = [
    "wandb>=0.16.0",
    "scipy>=1.11.0"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pytest-mock>=3.12.0"
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "feast>=0.40.0",
    "pyarrow>=15.0.0",
    "wandb>=0.16.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.14",
    "defusedxml>=0.7.1",
    "pytest>=8.0.0",
    "ruff>=0.9.0"
]

[project.urls]
Homepage = "https://koshiirra.github.io/midgley/"
Repository = "https://github.com/KoshiirRa/midgley"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
ignore = [
    "F401",  # Unused imports in __init__ and test scaffolding
    "F841",  # Unused local variables
    "F541",  # f-string without placeholders
]


