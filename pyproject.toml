[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midgley"
version = "0.3.5"
description = "LLM-Augmented Unleaded Gasoline Price Prediction Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "KoshiirRa"}
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.0",
    "google-genai>=0.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://koshiirra.github.io/midgley/"
Repository = "https://github.com/KoshiirRa/midgley"
